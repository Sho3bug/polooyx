name: Build POLOOYX

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows VST3 (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DPOLOOYX_BUILD_TESTS=ON

      - name: Build VST3 + Standalone + tests
        run: cmake --build build --config Release --parallel --target POLOOYX_VST3 POLOOYX_Standalone PolooyxTests

      - name: Run DSP test suite (Windows build)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path testrun | Out-Null
          Push-Location testrun
          & ..\build\PolooyxTests_artefacts\Release\PolooyxTests.exe
          $code = $LASTEXITCODE
          Pop-Location
          Get-Content testrun\test-output\TEST_REPORT.md | Select-Object -Last 5
          if ($code -ne 0) { throw "DSP tests failed" }

      - name: Validate VST3 with pluginval (strictness 10)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval -Force
          $p = Start-Process -FilePath .\pluginval\pluginval.exe -ArgumentList '--strictness-level 10 --validate-in-process --timeout-ms 900000 --output-dir pluginval-logs "build\POLOOYX_artefacts\Release\VST3\POLOOYX.vst3"' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { Get-ChildItem pluginval-logs | Get-Content; throw "pluginval failed" }
          "pluginval: PASS (strictness 10)" | Out-File pluginval-result.txt

      - name: Package
        shell: pwsh
        run: |
          $out = "dist\POLOOYX-Windows-x64"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item -Recurse build\POLOOYX_artefacts\Release\VST3\POLOOYX.vst3 "$out\POLOOYX.vst3"
          Copy-Item build\POLOOYX_artefacts\Release\Standalone\POLOOYX.exe "$out\POLOOYX Standalone.exe"
          Copy-Item "packaging\Install POLOOYX.bat" $out
          Copy-Item packaging\INSTALL.txt $out
          Copy-Item testrun\test-output\TEST_REPORT.md "$out\TEST_REPORT.md"
          Copy-Item pluginval-result.txt $out
          Compress-Archive -Path "$out\*" -DestinationPath dist\POLOOYX-Windows-x64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: POLOOYX-Windows-x64
          path: dist/POLOOYX-Windows-x64.zip

      - name: Publish latest build to the 'builds' branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          git config user.name "polooyx-ci"
          git config user.email "ci@users.noreply.github.com"
          $sha = "${{ github.sha }}".Substring(0,7)
          New-Item -ItemType Directory -Force -Path publish | Out-Null
          Copy-Item dist\POLOOYX-Windows-x64.zip publish\
          Copy-Item testrun\test-output\TEST_REPORT.md publish\TEST_REPORT-Windows.md
          Set-Location publish
          git init -q -b builds
          git add -A
          git commit -q -m "Windows build $sha"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" builds

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/POLOOYX-Windows-x64.zip
